  <path d="M264 230 C 272 204, 286 188, 306 180" stroke="#e9eeff" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- abdômen aceso -->
  <ellipse cx="256" cy="330" rx="46" ry="62" fill="url(#core)"/>
  <ellipse cx="243" cy="312" rx="14" ry="20" fill="#ffffff" opacity="0.75"/>
  <!-- faíscas -->
  <circle cx="132" cy="388" r="7" fill="#ffe27a" opacity="0.9"/>
