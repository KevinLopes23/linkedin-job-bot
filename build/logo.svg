<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16224a"/>
      <stop offset="0.6" stop-color="#0a1028"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe27a" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ffc94a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.55" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#f5b32a"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7f95d6" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="318" r="170" fill="url(#halo)"/>
  <!-- asas em V -->
  <path d="M248 300 C 210 230, 140 150, 92 128 C 120 190, 170 262, 238 316 Z" fill="url(#wing)"/>
  <path d="M264 300 C 302 230, 372 150, 420 128 C 392 190, 342 262, 274 316 Z" fill="url(#wing)"/>
